<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <!-- viewport: makes the page scale correctly on tablets and phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kimberly's Cookbook</title>

  <!-- ═══════════════════════════════════════════════════════════════
       FONTS — loaded from Google Fonts (requires internet connection)
       • Cormorant Garamond — elegant serif used for titles & body text
       • Jost             — clean sans-serif for labels and UI
       • Satisfy          — script font used for the "Kimberly's" logo
  ════════════════════════════════════════════════════════════════ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Satisfy&display=swap" rel="stylesheet">

  <style>

    /* ═══════════════════════════════════════════════════════════════
       COLOUR PALETTE — edit these variables to retheme the whole app.
       Every colour used throughout the file references one of these.
    ════════════════════════════════════════════════════════════════ */
    :root {
      --ink:        #1c1208;   /* near-black used for text & sidebar bg */
      --paper:      #faf6f0;   /* warm off-white — main background */
      --cream:      #f4ede0;   /* slightly darker cream — ingredients panel */
      --rust:       #b5451b;   /* primary accent — buttons, badges, highlights */
      --rust-light: #e8856a;   /* lighter rust — sidebar subtitle */
      --terracotta: #c96a3a;   /* secondary accent — sort button */
      --sage:       #6b8068;   /* muted green — success toast border */
      --gold:       #c8922a;   /* warm gold (available for future use) */
      --warm-gray:  #8a7f74;   /* medium gray — labels and secondary text */
      --border:     #e0d4c3;   /* subtle tan border between sections */
    }

    /* ── RESET ──────────────────────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── OUTER SHELL ─────────────────────────────────────────────
       .app is the flex container that holds sidebar + main side-by-side.
       On small screens (via media query below) it switches to column.
    ──────────────────────────────────────────────────────────── */
    .app { display: flex; height: 100vh; overflow: hidden; }


    /* ═══════════════════════════════════════════════════════════════
       SIDEBAR
       Fixed-width dark panel on the left containing:
         • Logo header
         • Search bar
         • Category filter pills
         • Recipe list
         • Footer buttons (New Recipe, Sort A→Z)
    ════════════════════════════════════════════════════════════════ */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--ink);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease; /* used for mobile slide-in/out */
    }

    /* Decorative radial glow in the top-right corner of the sidebar */
    .sidebar::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(181,69,27,0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Sidebar header: logo area ── */
    .sidebar-header {
      padding: 28px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      cursor: pointer; /* clicking the logo returns to the home screen */
    }
    .logo-script {
      font-family: 'Satisfy', cursive;
      font-size: 2rem;
      color: #fff;
      line-height: 1;
    }
    .logo-sub {
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--rust-light);
      margin-top: 5px;
    }

    /* ── Search bar ── */
    .search-wrap { padding: 14px 14px 6px; position: relative; }
    /* The magnifying glass SVG is positioned inside the input */
    .search-wrap svg {
      position: absolute;
      left: 28px; top: 50%;
      transform: translateY(-50%);
      opacity: 0.35;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      color: #fff;
      font-family: 'Jost', sans-serif;
      font-size: 0.82rem;
      font-weight: 300;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.28); }
    .search-input:focus { border-color: rgba(181,69,27,0.5); }

    /* ── Category filter pills ──
       Rendered dynamically in renderCats(). The "active" class is added
       to whichever category is currently selected.
    ── */
    .cats {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 6px 14px 10px;
    }
    .cat-pill {
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(244,237,224,0.12);
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .cat-pill:hover,
    .cat-pill.active { background: var(--rust); border-color: var(--rust); color: #fff; }

    /* Recipe count label (e.g. "42 recipes") */
    .recipe-count {
      padding: 0 14px 5px;
      font-size: 0.62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      font-weight: 300;
    }

    /* ── Scrollable recipe list ── */
    .recipe-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 8px;
      /* thin scrollbar styling */
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    .recipe-list::-webkit-scrollbar { width: 3px; }
    .recipe-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    /* Each row in the recipe list */
    .recipe-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.18s;
      border: 1px solid transparent;
      margin-bottom: 2px;
    }
    .recipe-item:hover { background: rgba(255,255,255,0.06); }
    /* The currently-open recipe gets a rust highlight */
    .recipe-item.active { background: rgba(181,69,27,0.14); border-color: rgba(181,69,27,0.28); }

    /* Emoji icon square on the left of each list row */
    .item-icon {
      width: 32px; height: 32px;
      border-radius: 7px;
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
    }
    .item-text { flex: 1; min-width: 0; }
    .item-name {
      font-size: 0.78rem;
      font-weight: 400;
      color: rgba(255,255,255,0.82);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .item-cat {
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      margin-top: 1px;
    }

    /* ── Sidebar footer: action buttons ── */
    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    /* Shared button style for "New Recipe" and "Sort A→Z" */
    .btn-new {
      width: 100%;
      padding: 10px;
      background: var(--rust);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn-new:hover { background: #c94f20; }
    /* The sort button reuses btn-new but with a terracotta colour override */
    .btn-sort { background: var(--terracotta); }
    .btn-sort:hover { background: #b85c2e; }


    /* ═══════════════════════════════════════════════════════════════
       MOBILE MENU TOGGLE
       On small screens, the sidebar slides off-screen and a ☰ button
       appears top-left to bring it back.
    ════════════════════════════════════════════════════════════════ */
    .mobile-toggle {
      display: none; /* hidden on desktop; shown via media query */
      position: fixed;
      top: 14px; left: 14px;
      z-index: 200;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 9px;
      width: 40px; height: 40px;
      font-size: 1.1rem;
      cursor: pointer;
      align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    /* Dark overlay behind the sidebar on mobile */
    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
    }
    .sidebar-overlay.visible { display: block; }


    /* ═══════════════════════════════════════════════════════════════
       MAIN CONTENT AREA
       Takes up all space to the right of the sidebar.
       Scrolls independently from the sidebar.
    ════════════════════════════════════════════════════════════════ */
    .main {
      flex: 1;
      overflow-y: auto;
      background: var(--paper);
      position: relative;
    }
    .main::-webkit-scrollbar { width: 5px; }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }


    /* ═══════════════════════════════════════════════════════════════
       WELCOME / HOME SCREEN
       Shown when no recipe is selected.
       Contains the greeting, daily quote, stat cards, and quick-action tiles.
    ════════════════════════════════════════════════════════════════ */
    .welcome {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      overflow: hidden;
    }

    /* ── Welcome hero banner ── */
    .welcome-hero {
      width: 100%;
      background: var(--ink);
      position: relative;
      overflow: hidden;
      padding: 52px 40px 44px;
      text-align: center;
    }
    /* Decorative background blobs inside the hero */
    .welcome-hero::before {
      content: '';
      position: absolute;
      top: -60px; left: -60px;
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(181,69,27,0.3) 0%, transparent 65%);
      pointer-events: none;
    }
    .welcome-hero::after {
      content: '';
      position: absolute;
      bottom: -80px; right: -40px;
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(200,146,42,0.18) 0%, transparent 65%);
      pointer-events: none;
    }
    .welcome-hero-inner { position: relative; z-index: 1; }
    .welcome-ornament {
      font-size: 2.8rem;
      margin-bottom: 14px;
      display: block;
      animation: floatBob 3s ease-in-out infinite;
    }
    @keyframes floatBob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
    .welcome h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 300;
      color: #fff;
      line-height: 1.1;
    }
    .welcome h2 em { font-style: italic; color: var(--rust-light); }
    .welcome-tagline {
      color: rgba(255,255,255,0.45);
      font-size: 0.83rem;
      font-weight: 300;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    /* ── Daily quote strip ──
       A rotating culinary quote shown below the greeting.
       To add / change quotes, edit the QUOTES array in the JavaScript section.
    ── */
    .quote-strip {
      width: 100%;
      background: var(--rust);
      padding: 12px 32px;
      text-align: center;
    }
    .quote-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-style: italic;
      color: #fff;
      line-height: 1.5;
    }
    .quote-attr {
      font-size: 0.62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }

    /* ── Stats row ──
       Three cards showing recipe count, category count, chicken count.
       Rendered dynamically in renderStats().
    ── */
    .welcome-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding: 28px 32px 0;
      width: 100%;
      max-width: 700px;
    }
    .stat-card {
      background: var(--cream);
      border-radius: 14px;
      padding: 20px 16px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 600;
      color: var(--rust);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--warm-gray);
      margin-top: 5px;
    }

    /* ── Quick-action tiles ──
       Four clickable cards: New Recipe, Browse All, Search, Latest.
       Rendered dynamically in renderStats().
    ── */
    .welcome-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 20px 32px;
      width: 100%;
      max-width: 700px;
    }
    .action-card {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    .action-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--rust);
      transform: scaleY(0);
      transition: transform 0.2s ease;
      transform-origin: bottom;
    }
    .action-card:hover { transform: translateY(-2px); border-color: var(--rust); box-shadow: 0 6px 20px rgba(181,69,27,0.1); }
    .action-card:hover::before { transform: scaleY(1); }
    .action-icon { font-size: 1.5rem; margin-bottom: 10px; display: block; }
    .action-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      color: var(--ink);
      font-weight: 400;
    }
    .action-sub {
      font-size: 0.67rem;
      color: var(--warm-gray);
      margin-top: 3px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ── Recently added strip ──
       Shows up to 4 of the most recently added recipes as clickable chips.
    ── */
    .recent-section {
      width: 100%;
      max-width: 700px;
      padding: 0 32px 32px;
    }
    .recent-label {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--rust);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .recent-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .recent-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .recent-chip {
      padding: 6px 14px;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.78rem;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.18s;
      font-family: 'Cormorant Garamond', serif;
    }
    .recent-chip:hover { background: var(--rust); color: #fff; border-color: var(--rust); }


    /* ═══════════════════════════════════════════════════════════════
       RECIPE DETAIL VIEW
       Shown when a recipe is selected. Contains:
         • Hero image / emoji banner
         • Ingredients panel (left)
         • Method / steps panel (right)
    ════════════════════════════════════════════════════════════════ */
    /* Slide-in animation when switching between recipes */
    .detail { animation: slideIn 0.28s ease; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Hero banner at the top of each recipe ── */
    .detail-hero {
      height: 240px;
      background: var(--cream);
      position: relative;
      overflow: hidden;
    }
    /* Background: shows image if one is set; otherwise shows a gradient + emoji */
    .detail-hero-bg {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #1c1208 0%, #3d2510 50%, #b5451b 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 5rem;
      background-size: cover;
      background-position: center;
	  background-repeat: no-repeat;
    }
    /* Dark gradient overlay so white text is readable over photos */
    .detail-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(28,18,8,0.72) 0%, transparent 55%);
    }
    /* Title and buttons in the bottom-left of the hero */
    .detail-hero-content {
      position: absolute;
      bottom: 20px; left: 30px; right: 30px;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    }
    .detail-cat-badge {
      display: inline-block;
      padding: 3px 11px;
      background: var(--rust);
      color: #fff;
      border-radius: 20px;
      font-size: 0.6rem; font-weight: 500; letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .detail-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 300;
      color: #fff;
      line-height: 1.1;
      text-shadow: 0 2px 16px rgba(0,0,0,0.4);
    }
    /* Print / Edit / Delete buttons */
    .detail-actions { display: flex; gap: 7px; flex-shrink: 0; }
    .action-btn {
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      color: #fff;
      font-family: 'Jost', sans-serif;
      font-size: 0.68rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s;
      display: flex; align-items: center; gap: 5px;
    }
    .action-btn:hover { background: rgba(255,255,255,0.2); }
    .action-btn.danger:hover { background: rgba(220,60,60,0.35); }

    /* ── Two-column layout: Ingredients | Method ── */
    .detail-body { display: grid; grid-template-columns: 1fr 1.4fr; }
    .detail-ingredients {
      padding: 28px 24px 40px 30px;
      border-right: 1px solid var(--border);
      background: var(--cream);
    }
    .detail-method { padding: 28px 30px 40px 24px; background: var(--paper); }

    /* Section header (e.g. "INGREDIENTS" with a line to the right) */
    .section-label {
      font-size: 0.56rem; font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
      color: var(--rust); margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Ingredients are displayed as pre-formatted text to preserve line breaks */
    .ingredients-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.96rem; font-weight: 400; line-height: 2;
      color: var(--ink); white-space: pre-wrap;
    }

    /* Numbered step rows */
    .step { display: flex; gap: 14px; margin-bottom: 14px; }
    .step-num {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--ink); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 600;
      flex-shrink: 0; margin-top: 2px;
    }
    .step-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; line-height: 1.65;
      color: #3a2c1c; font-weight: 300;
    }
    /* For un-numbered / free-form method text */
    .raw-steps {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; line-height: 1.9;
      color: #3a2c1c; font-weight: 300; white-space: pre-wrap;
    }


    /* ═══════════════════════════════════════════════════════════════
       RECIPE FORM (Add / Edit)
       Shown when "New Recipe" or "Edit" is clicked.
    ════════════════════════════════════════════════════════════════ */
    .form-view { padding: 40px 44px; max-width: 860px; }
    .form-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem; font-weight: 300;
      color: var(--ink); margin-bottom: 6px;
    }
    .form-title em { font-style: italic; color: var(--rust); }
    .form-subtitle { color: var(--warm-gray); font-size: 0.82rem; font-weight: 300; margin-bottom: 30px; }

    /* Two-column row for Name + Category */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    /* Full-width field wrapper */
    .form-full { margin-bottom: 16px; }
    /* Two-column row for Ingredients + Method textareas */
    .form-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

    /* Field label (e.g. "RECIPE NAME") */
    .form-label {
      display: block;
      font-size: 0.58rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
      color: var(--warm-gray); margin-bottom: 6px;
    }
    /* Standard text input */
    .form-input, .form-textarea {
      width: 100%;
      padding: 11px 14px;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.96rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.18s;
      resize: vertical;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--rust); }
    .form-textarea { min-height: 200px; line-height: 1.7; }

    /* ── Image browse row ──
       Contains: path text field + Browse button + hidden file input
    ── */
    .img-pick-wrap { display: flex; gap: 8px; align-items: center; }
    .img-pick-wrap .form-input { flex: 1; font-family: 'Jost', sans-serif !important; font-size: 0.84rem !important; }
    .btn-browse {
      flex-shrink: 0;
      padding: 10px 16px;
      background: var(--ink); color: #fff;
      border: none; border-radius: 9px;
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; transition: all 0.18s;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .btn-browse:hover { background: var(--rust); }

    /* Live image preview thumbnail shown after a file is chosen */
    .img-preview-wrap {
      position: relative;
      margin-top: 10px;
      display: inline-block;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .img-preview { display: block; max-height: 160px; max-width: 100%; object-fit: cover; }
    /* ✕ button to clear the chosen image */
    .img-clear-btn {
      position: absolute; top: 7px; right: 7px;
      width: 24px; height: 24px;
      background: rgba(28,18,8,0.7); color: #fff;
      border: none; border-radius: 50%;
      font-size: 0.68rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .img-clear-btn:hover { background: var(--rust); }

    /* Save / Cancel button row */
    .form-actions {
      display: flex; gap: 10px;
      margin-top: 24px; padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .btn-save {
      padding: 12px 30px;
      background: var(--ink); color: #fff;
      border: none; border-radius: 9px;
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: all 0.18s;
    }
    .btn-save:hover { background: var(--rust); }
    .btn-cancel {
      padding: 12px 20px;
      background: transparent; color: var(--warm-gray);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-family: 'Jost', sans-serif; font-size: 0.72rem;
      cursor: pointer; transition: all 0.18s;
    }
    .btn-cancel:hover { border-color: var(--ink); color: var(--ink); }


    /* ═══════════════════════════════════════════════════════════════
       TOAST NOTIFICATION
       Small pill that slides up from the bottom on save/error.
       Controlled by showToast() in JavaScript.
    ════════════════════════════════════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 0.78rem; font-weight: 400; letter-spacing: 0.5px;
      opacity: 0; pointer-events: none;
      transition: all 0.28s;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-left: 3px solid var(--sage); }
    .toast.error   { border-left: 3px solid #e05252; }


    /* ── Utility ── */
    .hidden { display: none !important; }


    /* ═══════════════════════════════════════════════════════════════
       PRINT STYLES
       When Ctrl+P or the Print button is used, hide the sidebar
       and let the recipe expand to fill the page.
    ════════════════════════════════════════════════════════════════ */
    @media print {
      .sidebar, .detail-actions, .mobile-toggle { display: none !important; }
      .main { overflow: visible !important; height: auto !important; }
      .detail { page-break-inside: avoid; }
      .detail-body { grid-template-columns: 1fr 1fr; page-break-inside: avoid; }
      .step { margin-bottom: 8px; page-break-inside: avoid; }
    }


    /* ═══════════════════════════════════════════════════════════════
       RESPONSIVE BREAKPOINTS

       860px — tablet landscape / small laptop:
         • Ingredients + Method stack vertically (1 column)
         • Form fields also stack to 1 column

       700px — tablet portrait:
         • Welcome stats & action tiles go to 2-column then 1-column
         • Padding tightened

       580px — phone:
         • Sidebar hidden off-screen; ☰ toggle appears
         • Form gets tighter padding
         • Detail hero shrinks
         • Action tiles stack to 1 column
    ════════════════════════════════════════════════════════════════ */
    @media (max-width: 860px) {
      /* Ingredients and Method stack vertically */
      .detail-body { grid-template-columns: 1fr; }
      .detail-ingredients { border-right: none; border-bottom: 1px solid var(--border); }
      /* Form fields: Name/Category and Ingredients/Method each become full-width */
      .form-two-col, .form-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      .welcome h2 { font-size: 2.4rem; }
      .welcome-stats { grid-template-columns: repeat(3, 1fr); padding: 20px 20px 0; }
      .welcome-actions { grid-template-columns: repeat(2, 1fr); padding: 16px 20px; }
      .recent-section { padding: 0 20px 24px; }
    }

    @media (max-width: 580px) {
      /* ── Sidebar slides off to the left; toggled by JS ── */
      .sidebar {
        position: fixed;
        left: 0; top: 0;
        z-index: 100;
        transform: translateX(-100%); /* hidden by default */
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      }
      /* .sidebar-open class is added by toggleSidebar() */
      .sidebar.sidebar-open { transform: translateX(0); }

      /* Show the ☰ hamburger button */
      .mobile-toggle { display: flex; }

      /* Main area fills the full screen width */
      .main { width: 100%; }

      .form-view { padding: 50px 18px 24px; }
      .detail-hero { height: 200px; }
      .detail-title { font-size: 1.8rem; }
      .detail-hero-content { left: 16px; right: 16px; }

      /* Stats: 3 cards stay in a row but shrink */
      .welcome-stats { gap: 10px; }
      .stat-num { font-size: 1.8rem; }

      /* Action tiles: stack to single column on phones */
      .welcome-actions { grid-template-columns: 1fr; }

      /* Tighten hero padding */
      .welcome-hero { padding: 44px 24px 36px; }
      .quote-strip { padding: 10px 20px; }
    }

  </style>
</head>
<body>

<!-- ☰ Mobile menu toggle (only visible on small screens) -->
<button class="mobile-toggle" id="mobileToggle" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
<!-- Dark overlay behind sidebar on mobile — clicking it closes the sidebar -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app">

  <!-- ═══════════════════════════════════════════════════════════════
       SIDEBAR
  ════════════════════════════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">

    <!-- Logo — clicking returns to the home/welcome screen -->
    <div class="sidebar-header" onclick="goHome()">
      <div class="logo-script">Kimberly's</div>
      <div class="logo-sub">Botanical Cookbook</div>
    </div>

    <!-- Search input — triggers renderList() on every keystroke -->
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="search-input" id="search" placeholder="Search (e.g. chicken !nuts)…" oninput="renderList()">
    </div>

    <!-- Category filter pills — rendered by renderCats() -->
    <div class="cats" id="catFilters"></div>

    <!-- Recipe count (e.g. "42 recipes") -->
    <div class="recipe-count" id="recipeCount"></div>

    <!-- Scrollable list of recipes — rendered by renderList() -->
    <div class="recipe-list" id="recipeList"></div>

    <!-- Footer buttons -->
    <div class="sidebar-footer">
      <button class="btn-new" onclick="showAdd()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Recipe
      </button>
      <!-- Sort button — calls sortRecipesAZ() defined in JS -->
      <button class="btn-new btn-sort" onclick="sortRecipesAZ()">⇅ Sort A → Z</button>
    </div>

  </aside><!-- /sidebar -->


  <!-- ═══════════════════════════════════════════════════════════════
       MAIN CONTENT
  ════════════════════════════════════════════════════════════════ -->
  <main class="main" id="main">

    <!-- ── WELCOME SCREEN ───────────────────────────────────── -->
    <div class="welcome" id="welcome">

      <!-- Hero banner with greeting -->
      <div class="welcome-hero">
        <div class="welcome-hero-inner">
          <span class="welcome-ornament">🌿</span>
          <h2>Hello, <em>Kimberly</em></h2>
          <p class="welcome-tagline">Your personal garden of flavours</p>
        </div>
      </div>

      <!-- Rotating daily quote — quote text is set by renderQuote() in JS -->
      <div class="quote-strip">
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-attr" id="quoteAttr"></div>
      </div>

      <!-- Stat cards: Recipes / Categories / Chicken — rendered by renderStats() -->
      <div class="welcome-stats" id="welcomeStats"></div>

      <!-- Quick-action tiles — rendered by renderStats() -->
      <div class="welcome-actions" id="welcomeActions"></div>

      <!-- Recently added recipes row — rendered by renderRecent() -->
      <div class="recent-section">
        <div class="recent-label">Recently Added</div>
        <div class="recent-chips" id="recentChips"></div>
      </div>

    </div><!-- /welcome -->


    <!-- ── RECIPE DETAIL VIEW ────────────────────────────────── -->
    <!-- Hidden until a recipe is selected (showDetail is called) -->
    <div class="detail hidden" id="detailView">

      <!-- Hero banner: image or emoji + title + action buttons -->
      <div class="detail-hero">
        <div class="detail-hero-bg" id="heroEmoji">🍽️</div>
        <div class="detail-hero-overlay"></div>
        <div class="detail-hero-content">
          <div>
            <div class="detail-cat-badge" id="detCat"></div>
            <div class="detail-title" id="detTitle"></div>
          </div>
          <div class="detail-actions">
            <!-- Print: uses browser print dialog, sidebar hidden via @media print -->
            <button class="action-btn" onclick="window.print()">
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="6 9 6 2 18 2 18 9"/>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                <rect x="6" y="14" width="12" height="8"/>
              </svg>
              Print
            </button>
            <!-- Edit: calls editRecipe(i) — i is set when detail is opened -->
            <button class="action-btn" id="btnEdit">
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Edit
            </button>
            <!-- Delete: calls deleteRecipe(i) with a confirmation prompt -->
            <button class="action-btn danger" id="btnDelete">
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              </svg>
              Delete
            </button>
          </div>
        </div>
      </div>

      <!-- Ingredients | Method two-column body -->
      <div class="detail-body">
        <div class="detail-ingredients">
          <div class="section-label">Ingredients</div>
          <!-- Filled by showDetail() using r.ing -->
          <div class="ingredients-text" id="detIng"></div>
        </div>
        <div class="detail-method">
          <div class="section-label">Method</div>
          <!-- Filled by showDetail(); numbered steps get .step divs, freeform gets .raw-steps -->
          <div id="detSteps"></div>
        </div>
      </div>

    </div><!-- /detailView -->


    <!-- ── ADD / EDIT FORM ───────────────────────────────────── -->
    <!-- Hidden until showAdd() or editRecipe() is called -->
    <div class="form-view hidden" id="formView">

      <!-- Title changes between "New Creation" and "Edit Recipe" -->
      <div class="form-title" id="formTitle">New <em>Creation</em></div>
      <p class="form-subtitle" id="formSubtitle">Add a new recipe to your collection.</p>

      <!-- Row 1: Recipe name + Category -->
      <div class="form-grid">
        <div>
          <label class="form-label">Recipe Name</label>
          <input class="form-input" id="f_name" type="text" placeholder="Rosewater Cupcakes…">
        </div>
		<div class="form-full">
  <label class="form-label">EMOJI</label>
  <input id="f_emoji" class="form-input" placeholder="e.g. 🍰 🍗 🍝 🥗" />
</div>
 <div>
          <label class="form-label">Category</label>
          <input class="form-input" id="f_cat" type="text" placeholder="Dessert, Chicken, Beef…">
        </div>
      </div>

      <!-- Image field with Browse button -->
      <div class="form-full">
        <label class="form-label">Photo (optional)</label>
        <div class="img-pick-wrap">
          <!-- Text field: user can type a path like images/dish.jpg, or use Browse -->
          <input class="form-input" id="f_img" type="text"
                 placeholder="images/my-dish.jpg  or click Browse…"
                 oninput="previewImg(this.value)">
          <!-- Browse button opens the hidden file input below -->
          <button class="btn-browse" type="button" onclick="document.getElementById('f_img_file').click()">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            Browse
          </button>
          <!-- Hidden file input — accepts images only; handled by handleImgFile() -->
          <input type="file" id="f_img_file" accept="image/*" style="display:none"
                 onchange="handleImgFile(this)">
        </div>
        <!-- Preview thumbnail appears here after a file is picked -->
        <div class="img-preview-wrap" id="imgPreviewWrap" style="display:none">
          <img id="imgPreview" src="" alt="Preview" class="img-preview">
          <button class="img-clear-btn" type="button" onclick="clearImg()" title="Remove image">✕</button>
        </div>
      </div>

      <!-- Row 2: Ingredients | Method textareas -->
      <div class="form-two-col">
        <div>
          <label class="form-label">Ingredients</label>
          <textarea class="form-textarea" id="f_ing" placeholder="One ingredient per line…"></textarea>
        </div>
        <div>
          <label class="form-label">Method / Steps</label>
          <textarea class="form-textarea" id="f_steps" placeholder="1. Step one&#10;2. Step two…"></textarea>
        </div>
      </div>

      <!-- Save and Cancel -->
      <div class="form-actions">
        <button class="btn-save" onclick="saveRecipe()">Save Recipe</button>
        <button class="btn-cancel" onclick="hideForm()">Cancel</button>
      </div>

    </div><!-- /formView -->

  </main><!-- /main -->
</div><!-- /app -->

<!-- Toast notification (shown briefly on save/error) -->
<div class="toast" id="toast"></div>


<!-- ═══════════════════════════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════════════════════════════ -->
<script>

/* ─────────────────────────────────────────────────────────────────
   CATEGORY EMOJI MAP
   Maps category names to an emoji shown in the sidebar list and
   on the recipe hero when no photo is available.
   To add a new category, add a line: 'YourCategory': '🍽️'
───────────────────────────────────────────────────────────────── */
const ICONS = {
  'Cakes':    '🎂',
  'Breads':   '🍞',
  'Chicken':  '🍗',
  'Beef':     '🥩',
  'Pork':     '🐷',
  'Turkey':   '🦃',
  'Pasta':    '🍝',
  'Rice':     '🍚',
  'Cookies':  '🍪',
  'Pie':      '🥧',
  'Meatballs':'🍖',
  'Pancakes': '🥞',
  'Christmas':'🎄',
  'Fries':    '🍟',
  'Chili':    '🌶️',
  'Potatoes': '🥔',
  'Hot Dogs': '🌭',
  'Imported': '📋',
  'default':  '🍽️'
};
function icon(cat) { return ICONS[cat] || ICONS.default; }


/* ─────────────────────────────────────────────────────────────────
   DAILY QUOTES
   One quote is picked based on the day of the year so it changes
   every day but stays the same all day.
   To add more quotes: just push another { text, author } object.
───────────────────────────────────────────────────────────────── */
const QUOTES = [
  { text: "Cooking is love made visible.", author: "Anonymous" },
  { text: "One cannot think well, love well, sleep well, if one has not dined well.", author: "Virginia Woolf" },
  { text: "The secret ingredient is always love.", author: "Anonymous" },
  { text: "Food is our common ground, a universal experience.", author: "James Beard" },
  { text: "Cooking is at once child's play and adult joy.", author: "Craig Claiborne" },
  { text: "A recipe has no soul. You, as the cook, must bring soul to the recipe.", author: "Thomas Keller" },
  { text: "Life is uncertain. Eat dessert first.", author: "Ernestine Ulmer" },
  { text: "Cooking is like painting or writing a song — just as few ingredients can come together to create something magnificent.", author: "Ina Garten" },
  { text: "The kitchen is where memories are made.", author: "Anonymous" },
  { text: "People who love to eat are always the best people.", author: "Julia Child" },
  { text: "First we eat, then we do everything else.", author: "M.F.K. Fisher" },
  { text: "Laughter is brightest in the place where the food is.", author: "Irish Proverb" }
];

function renderQuote() {
  /* Pick a quote based on day-of-year so it rotates daily */
  const day = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  const q = QUOTES[day % QUOTES.length];
  document.getElementById('quoteText').textContent = `"${q.text}"`;
  document.getElementById('quoteAttr').textContent = `— ${q.author}`;
}


/* ─────────────────────────────────────────────────────────────────
   RECIPE DATA
   Each recipe is an object with these fields:
     name  — display name (also used as the image filename base)
     cat   — category (must match a key in ICONS for the right emoji)
     img   — relative path to image, e.g. "images/Banana Bread.jpg"
             Leave as "" to show the category emoji instead.
     ing   — ingredients as a plain text string (line breaks preserved)
     steps — method as a plain text string; lines starting "1." etc.
             get parsed into numbered step bubbles automatically.
───────────────────────────────────────────────────────────────── */
let recipes = [
{name:"Chocolate Cake",cat:"Cakes",img:"",ing:"CHOCOLATE CAKE\n(1 cake)\nCake:\n1 Cup Flour\n1 Cup Granulated Sugar\n1/2 Cup Unsweetened Cocoa Powder\n3/4 tsp. Baking Powder\n3/4 tsp. Baking Soda\n1/2 tsp. Salt\n1 Egg\n1/2 Cup Milk\n1/4 Cup Vegetable Oil\n2 tsp. Vanilla Extract\n1/2 Cup Warm Water\n\nFrosting:\n1/2 Cup Milk Chocolate Chips\n1/4 Cup Sour Cream\n1/4 tsp. Vanilla Extract",steps:"1.\nPreheat oven to 350F. Grease or line a glass casserole dish with parchment paper.\n2.\nAdd flour, sugar, cocoa powder, baking powder, baking soda and salt to stand mixer bowl and whisk at low speed.\n3.\nAdd in the egg, milk, oil and vanilla extract. Mix on low until incorporated, then increase speed and mix 2 minutes.\n4.\nAdd warm water and gently stir. The batter will be very thin.\n5.\nPour into the casserole dish and bake 35-40 minutes, or until a toothpick comes out clean.\n6.\nCool 10 minutes in pan, then remove and continue cooling on a rack until room temperature.\nFrosting: Heat chocolate chips in the microwave at 50% power in 30 second increments, stirring after each, until fully melted. Add sour cream and vanilla and stir until fluffy. Spread over cooled cake."},
{name:"Banana Bread",cat:"Breads",img:"",ing:"BANANA BREAD (1 loaf)\n2 Cups Flour\n1 tsp. Baking Soda\n1/4 tsp. Salt\n1/2 tsp. Cinnamon\n1 Egg\n1-1/8 Cups Sugar\n1/2 Cup Vegetable Oil\n2 Tbsp. Buttermilk*\n1 tsp. Vanilla Extract\n3 extra ripe Bananas, mashed\n\n*If no buttermilk: mix 1-3/4 Tbsp milk with 1/4 Tbsp lemon juice",steps:"1.\nPreheat oven to 325F. Line a loaf pan with parchment paper.\n2.\nIn a large bowl, whisk together flour, baking soda, salt and cinnamon.\n3.\nIn a small bowl, mix egg, sugar and vegetable oil until combined.\n4.\nMix the flour mixture and egg mixture together. It will be dry and thick.\n5.\nAdd buttermilk, vanilla and bananas and mix until combined. Pour into loaf pan.\n6.\nBake on the center rack for 75-80 minutes or until a knife comes out clean."},
{name:"Chicken & Potatoes, Dijon Gravy",cat:"Chicken",img:"",ing:"CHICKEN & POTATOES WITH DIJON CREAM SAUCE (2 servings)\n1 Large boneless, skinless Chicken Breast, cut into strips\n2 tsp. Italian Seasoning\n2 Medium Potatoes, peeled and chopped into 1-inch cubes\nSalt and Pepper, to taste\n1 Tbsp. Margarine\n1 Tbsp. Extra Virgin Olive Oil (EVOO)\n\nDijon Cream Sauce:\n1 Tbsp. Margarine\n1 Clove Garlic, minced\n1/2 tsp. Dry Chicken Stock Mix\n1/2 Cup Water\n2 Tbsp. Dijon Mustard\n1/2 Cup Heavy Cream\nSalt and Pepper, to taste",steps:"1.\nPreheat oven to 375F.\n2.\nMake Chicken Stock: Boil 1/2 cup water, add 1/2 tsp. chicken stock powder, mix well.\n3.\nToss potatoes with 1 tsp. Italian seasoning, 1/2 Tbsp. EVOO, salt and pepper.\n4.\nMelt margarine in wok pan over heat 4. Add potatoes and cook 6 minutes, stirring occasionally until slightly browned. Transfer to casserole dish.\n5.\nBrush chicken with remaining Italian seasoning, salt, pepper and EVOO. Sear in same pan, 2 minutes each side. Transfer to casserole dish with potatoes.\n6.\nIn same pan, melt 1 Tbsp margarine. Add garlic, cook 30 seconds. Stir in chicken stock and Dijon mustard. Slowly whisk in heavy cream and season.\n7.\nPour sauce over chicken and potatoes, toss well.\n8.\nBake 25 minutes until chicken is cooked through and potatoes are soft."},
{name:"Chicken Quesadillas",cat:"Chicken",img:"",ing:"CHICKEN QUESADILLAS (2 quesadillas)\n1 small boneless, skinless Chicken Breast, diced small\n1 tsp. Chili Powder\n1/2 tsp. Ground Cumin\nSalt and Pepper, to taste\n4 tsp. Extra Virgin Olive Oil (EVOO), divided\n1/2 Green Pepper, finely diced\n1/2 Red Pepper, finely diced\n1 small Onion, finely diced\n2 Garlic Cloves, minced\n1 tsp. Lime Juice\n2, 10-inch Flour Tortillas\n1 Tbsp. Margarine, melted\n1 cup Cheddar Cheese, shredded",steps:"1.\nToss chicken with chili powder, cumin, salt and pepper.\n2.\nHeat 2 tsp. EVOO in wok pan over heat 4. Cook chicken 5-6 minutes until cooked through. Transfer to a large container.\n3.\nIn same pan, heat 2 tsp. EVOO. Add green pepper, red pepper, onions and garlic and cook until tender (5-6 minutes). Transfer to container with chicken. Add lime juice and mix well.\n4.\nWipe pan clean. Brush tortillas with melted margarine. Place one tortilla margarine-side down. Sprinkle cheese, then add half the chicken mixture. Fold in half and cook 4-5 minutes until cheese is melted. Flip and cook another 4-5 minutes.\n5.\nRepeat for second tortilla."},
{name:"Chocolate Chip Cookies",cat:"Cookies",img:"",ing:"CHOCOLATE CHIP COOKIES (about 28 cookies)\n2-1/4 Cups All-Purpose Flour\n1 tsp. Baking Soda\n1/2 tsp. Salt\n1 Cup Unsalted Butter\n3/4 Cup Granulated Sugar\n3/4 Cup Light Brown Sugar\n1 tsp. Vanilla Extract\n2 Eggs\n2-1/4 Cups Semi-Sweet Chocolate Chips",steps:"1.\nPreheat oven to 375F.\n2.\nIn one bowl, stir together flour, baking soda and salt.\n3.\nIn another bowl, beat butter, both sugars and vanilla until creamy. Add eggs and beat well. Gradually add flour mixture and beat. Stir in chocolate chips with a spatula.\n4.\nUsing an ice cream scoop, drop cookie dough onto parchment-lined cookie sheet, keeping 1 inch apart.\n5.\nBake 10 minutes or until lightly browned. Cool slightly, then transfer to a cooling rack."},
{name:"Dad's Christmas Stuffing",cat:"Christmas",img:"",ing:"KIMBERLY'S TAKE ON DAD'S CHRISTMAS STUFFING (4-6 servings)\n8 Medium-sized Potatoes, peeled\n2 Medium-sized Onions, diced\n6 Slices White Bread, broken up into small pieces\n4-6 tsp. Ground Sage (adjust for taste)\n4-6 tsp. Ground Savory (adjust for taste)\nSalt & Pepper, to taste\nWater or Turkey Broth (to moisten)",steps:"1.\nBoil potatoes in salted water until fork-soft (10-15 min). Drain and mash. Let cool about 30 minutes.\n2.\nBreak up bread into small pieces, adding sage and savory as you go (about 1/2 tsp each per 2 slices). Reserve some seasonings for the potatoes.\n3.\nCombine cooled potatoes with onions and seasoned bread in a large casserole dish. Mix well.\n4.\nAdd remaining sage, savory, salt and pepper to taste. Combine well.\n5.\nCook in the microwave 7 minutes at a time, stirring and adding 1 Tbsp water or turkey broth after each interval. Total time: about 28 minutes.\n\nAlternatively: bake at 350F for 60 minutes, stirring and adding liquid every 10 minutes."},
{name:"Cream Cheese Frosting",cat:"Cakes",img:"",ing:"CREAM CHEESE FROSTING\n1 package (8 oz) Cream Cheese, softened\n1/2 Cup Butter or Margarine, room temperature\n2 tsp. Vanilla Extract\n5 Cups Icing Sugar",steps:"1.\nIn stand mixer with paddle attachment, mix cream cheese, butter and vanilla until light and fluffy.\n2.\nGradually beat in icing sugar until you reach spreading consistency."},
{name:"Tomato Juice Cake",cat:"Cakes",img:"",ing:"TOMATO JUICE CAKE (1 cake)\n1/2 Cup Tenderflake Shortening\n2 Cups Sugar\n2 tsp. Cinnamon\n2 tsp. Ground Cloves\n1 Can (19 oz) Tomato Juice\n2 tsp. Baking Soda\n3 Cups Flour\n1-1/2 Cups Raisins",steps:"1.\nPreheat oven to 350F. Grease a bundt pan.\n2.\nIn stand mixer with paddle attachment, combine shortening, sugar, cinnamon and cloves. Mix in tomato juice and baking soda. Add flour. Mix in raisins.\n3.\nPour into greased bundt pan. Bake 1 hour or until toothpick comes out clean.\n4.\nCool the cake and top with cream cheese frosting."},
{name:"Chili Cheese Fries",cat:"Fries",img:"",ing:"CHILI CHEESE FRIES (2 servings)\nChili: 1 lb. Lean Ground Beef, 1 Small Onion diced, 2 Cloves Garlic minced, 1 tsp. Chili Powder, 1 tsp. Ground Cumin, 1 Tbsp. Tomato Paste, 1/2 Tbsp. Worcestershire Sauce, Beef Stock (1/4 tsp powder + 1/4 cup water), Salt and Pepper\n\nFries: 2 medium potatoes cut into fries, 1 Tbsp. Grill Seasoning, 1 Tbsp. Extra Virgin Olive Oil (EVOO)\n\nCheese Sauce: 1 Tbsp. Margarine, 1 Tbsp. Flour, 1 tsp. Mustard, Chicken Stock (1/4 tsp powder + 1/4 cup water), 1/4 cup Milk, 1-1/4 Cup Cheddar Cheese shredded",steps:"1.\nMake Beef Stock and Chicken Stock separately.\n2.\nAdd potatoes to deep fryer with grill seasoning and EVOO. Cook 35-40 minutes.\n3.\nBrown ground beef in a large pan over heat 6. Add onions, garlic, chili powder and cumin. Cook until onions are soft, season with salt and pepper.\n4.\nAdd tomato paste, mix and cook 2 minutes. Add Worcestershire sauce and beef stock. Bring to a bubble, reduce to heat 3, simmer until thickened (10 minutes).\n5.\nFor cheese sauce: Melt margarine in small pot, add flour and whisk making a roux. Add chicken stock and milk, let thicken. Add mustard. Remove from heat, mix in cheese until melted.\n6.\nTop fries with chili mixture, then drizzle with cheese sauce."},
{name:"Beef Stroganoff",cat:"Beef",img:"",ing:"BEEF STROGANOFF (4 servings)\n2 Tbsp. Margarine\n1 small Onion, diced\n1 lb. Lean Ground Beef\n2 tsp. Garlic Powder\n5 Tbsp. Flour\n1 tsp. Paprika\n4 Cups Beef Stock (4 tsp powder + 4 cups water)\nSalt and Pepper, to taste\n4 Cups Egg Noodles\n1/2 Cup Sour Cream",steps:"1.\nMake Beef Stock: Boil 4 cups water, add 4 tsp. beef stock powder, mix well.\n2.\nHeat large pan over heat 6. Add margarine, onion, ground beef and garlic powder. Break up meat and cook until browned. Drain if needed.\n3.\nAdd flour and paprika. Stir until thickened (2-3 min).\n4.\nAdd beef stock, bring to a boil.\n5.\nAdd egg noodles, salt and pepper. Reduce to heat 3, cover and simmer until noodles are tender (10 min), stirring occasionally.\n6.\nAdd sour cream and mix well."},
{name:"Pepper Steak Stir-Fry",cat:"Beef",img:"",ing:"PEPPER STEAK STIR-FRY (2 servings)\nSauce: 1-1/2 Tbsp Sugar, 1/4 Cup Soy Sauce, 1/4 Cup Water, 1-1/2 Tbsp Corn Starch\n\n2 Tbsp Extra Virgin Olive Oil (EVOO)\n1 Red Bell Pepper, cut into thin strips\n1 Green Bell Pepper, cut into thin strips\n1 package Steak Stir-Fry Strips, cut into bite size pieces\n2 Garlic Cloves, minced\n1/2 tsp Ground Ginger\nSalt and Pepper\n\nRice: 1 Cup Minute Rice, 1 Cup Water, 1 tsp Salt, 1 Tbsp Margarine",steps:"1.\nMake Rice: Boil water with salt and margarine. Turn off heat, add rice, cover, remove from element. Fluff before serving.\n2.\nMake Sauce: Whisk together soy sauce, sugar, water and cornstarch in a small bowl.\n3.\nHeat EVOO in wok pan over heat 4. Add peppers and cook about 5 minutes.\n4.\nMove peppers to the side. Season steak with salt and pepper and add to pan. Cook about 5 minutes, stirring. Mix steak and peppers together and cook another 2 minutes.\n5.\nAdd garlic and ginger. Cook another 2 minutes.\n6.\nAdd sauce, mix together, and cook about 2 minutes until thickened. Serve over rice."},
{name:"Mac 'n Cheese 'n Burgers",cat:"Beef",img:"",ing:"MAC 'N CHEESE 'N BURGERS (4 servings)\n4 Cups Fusili Pasta or Macaroni\n1 lb. Lean Ground Beef\n1 small Onion, diced\n2 tsp. Worcestershire Sauce\nSalt and Pepper\n\nCheese Sauce:\n2 Tbsp Margarine, 2 Tbsp Flour\nChicken Stock (1 tsp powder + 1 cup water)\n1 Cup Milk, 1 Tbsp Dijon Mustard\n1 Cup Cheddar Cheese, shredded",steps:"1.\nMake Chicken Stock: Boil 1 cup water, add 1 tsp. chicken stock powder.\n2.\nBoil salted pasta water. Cook pasta 10 minutes, drain.\n3.\nBrown beef in large pan over heat 6, breaking up. Add onion, Worcestershire, salt and pepper. Cook 5-6 more minutes. Drain beef.\n4.\nMelt margarine in small pot, add flour and whisk (roux). Add chicken stock and milk, heat until bubbling. Add Dijon mustard. Remove from heat, mix in cheese until melted.\n5.\nIn a large bowl, mix pasta, beef mixture and cheese sauce together."},
{name:"Teriyaki Turkey Rice Bowls",cat:"Turkey",img:"",ing:"TERIYAKI TURKEY RICE BOWLS (4 servings)\nTeriyaki Sauce: 1/2 Cup Soy Sauce, 1/4 Cup Water, 2 Tbsp Red Wine Vinegar, 2 Tbsp Brown Sugar, 2 Tbsp Sugar, 2 Garlic Cloves minced, 1 tsp Ground Ginger, (thickener: 1 Tbsp Cornstarch + 2 Tbsp Warm Water)\n\n1 Tbsp Vegetable Oil\n1/2 Cup Onion, diced\n4 Cloves Garlic, minced\n1 lb. Ground Turkey\n1 Cup Broccoli, finely chopped\n2 large Carrots, peeled and grated\nGreen Onions for garnish\n\nRice: 2 Cups Minute Rice, 2 Cups Water, 2 tsp Salt, 2 Tbsp Margarine",steps:"1.\nMake Rice: Boil 2 cups water with salt and margarine. Off heat, add rice, cover, remove from element. Fluff before serving.\n2.\nIn a small saucepan over heat 4, mix teriyaki sauce ingredients (except cornstarch mixture) until sugars dissolve.\n3.\nWhisk cornstarch with 2 Tbsp warm water until dissolved. Slowly whisk into teriyaki sauce and simmer until thickened. Remove from heat.\n4.\nHeat vegetable oil in large pan over heat 6. Add diced onions, cook 5-6 minutes until tender.\n5.\nAdd turkey and garlic, cook until half cooked (7 min), breaking up. Add carrots and broccoli. Cook until turkey is fully cooked (7-10 more min).\n6.\nPour teriyaki sauce over turkey mixture. Simmer 5 minutes. Serve over cooked rice."},
{name:"Grilled Steak Fajitas",cat:"Beef",img:"",ing:"GRILLED STEAK FAJITAS (4-6 fajitas)\nMarinade: 6 Tbsp Lime Juice, 1/3 Cup EVOO, 3 Cloves Garlic minced, 1 Jalapeno minced, 2 tsp Chili Powder, 1-1/2 tsp Ground Cumin, 1 tsp Paprika, Salt and Pepper\n\n1 lb. Flank Steak, thinly sliced\n1 Red Bell Pepper, thinly sliced\n1 Green Bell Pepper, thinly sliced\n1 Medium Onion, thinly sliced\n4-6 Large Tortillas\nShredded Cheese\nSour Cream (optional)",steps:"1.\nCombine marinade ingredients. Reserve 3 Tbsp for vegetables.\n2.\nPlace steak in container with marinade, mix well. Chill 3-6 hours.\n3.\nHeat grill pan over heat 6 for 5-10 minutes until extremely hot. Lightly oil, grill steak 3-4 minutes, stirring occasionally. Remove steak.\n4.\nToss peppers and onions with reserved marinade. Grill 5-10 minutes until crisp-tender.\n5.\nServe steak and vegetables in tortillas with cheese and sour cream."},
{name:"Honey Chicken & Green Beans",cat:"Chicken",img:"",ing:"HONEY LEMON CHICKEN AND GREEN BEANS (3 servings)\nHoney Lemon Sauce: Chicken Stock (3/4 tsp powder + 3/4 cup water), 1-1/2 Tbsp Soy Sauce, 1 tsp Lemon Juice, 2 Tbsp Rice Wine Vinegar, 1/4 Cup Honey, 2 Tbsp Cornstarch, 1/4 tsp Ground Ginger, Pinch Red Pepper Flakes, 1 Garlic Clove minced\n\n1 Boneless Skinless Chicken Breast, cut into bite size pieces\nExtra Virgin Olive Oil (EVOO)\n1 Cup Green Beans, trimmed and cut into bite size pieces\nSalt and Pepper\n\nRice: 1 Cup Minute Rice, 1 Cup Water, 1 tsp Salt, 1 Tbsp Margarine",steps:"1.\nMarinate chicken in soy sauce and rice wine vinegar while preparing other ingredients.\n2.\nMake Rice: Boil water with salt and margarine. Off heat, add rice, cover, remove from element.\n3.\nMake Honey Lemon Sauce: Whisk all sauce ingredients together until combined. Set aside.\n4.\nHeat 1 Tbsp EVOO in wok pan over heat 4. Cook green beans 6-7 minutes until bright green but crisp. Remove and set aside.\n5.\nAdd 1 Tbsp EVOO to same pan. Cook chicken 6-7 minutes until cooked through.\n6.\nReturn green beans to pan. Reduce to heat 4, pour in sauce. Cook 2-3 minutes until thickened, tossing to coat.\n7.\nServe over cooked rice."},
{name:"Chili",cat:"Chili",img:"",ing:"CLASSIC CHILI (6 servings)\n1 Tbsp Extra Virgin Olive Oil (EVOO)\n1 Medium Onion, diced\n1 lb. Lean Ground Beef\n1-1/2 Tbsp Chili Powder\n1 Tbsp Ground Cumin\n1 Tbsp Sugar\n2 Tbsp Tomato Paste\n1 Tbsp Garlic Powder\n1 tsp Salt, 1/2 tsp Pepper, 1/8 tsp Cayenne Pepper\nBeef Stock (1-1/2 tsp powder + 1-1/2 cups water)\n1 Can (19 oz) Seasoned Petite Diced Tomatoes\n1 Can (16 oz) Red Kidney Beans, drained\n1 Can (7 oz) Tomato Sauce",steps:"1.\nMake Beef Stock: Boil 1-1/2 cups water, add 1-1/2 tsp. beef stock powder.\n2.\nHeat EVOO in large pot over heat 6. Add onion and cook 6-7 minutes.\n3.\nAdd ground beef, break apart and cook 6-7 minutes until browned. Drain if needed.\n4.\nAdd all seasonings and tomato paste. Stir until well combined.\n5.\nAdd beef stock, diced tomatoes (with juice), kidney beans and tomato sauce. Stir well.\n6.\nBring to a low boil. Reduce heat and simmer uncovered 25-30 minutes, stirring occasionally.\n7.\nRemove from heat, let rest 5-10 minutes before serving. Top with shredded cheese."},
{name:"Egg Noodle Chicken",cat:"Chicken",img:"",ing:"EGG NOODLE CHICKEN (2 servings)\n2 Cups Egg Noodles\n2 Tbsp Margarine\n1 Tbsp Dill\n1 Tbsp Chives\n1 Boneless Skinless Chicken Breast, cut into small cubes\n2 Tbsp Extra Virgin Olive Oil (EVOO), divided\n1 Medium Onion, cut into thin half rings\n1 Red Pepper, cut into thin strips\n2 Garlic Cloves, minced\nChicken Stock (1/2 tsp powder + 1/2 cup water)\n2 tsp Paprika\n2 tsp Allspice\n1/4 Cup Sour Cream\nSalt and Pepper",steps:"1.\nMake Chicken Stock: Boil 1/2 cup water, add 1/2 tsp. chicken stock powder.\n2.\nBoil salted water, cook egg noodles 10 minutes.\n3.\nSeason chicken with salt and pepper. Heat 1 Tbsp EVOO in large pan over heat 6. Cook chicken 5-6 minutes until cooked through. Remove and set aside.\n4.\nAdd remaining EVOO, cook peppers, onions and garlic 6-7 minutes until tender.\n5.\nReturn chicken to pan with paprika and allspice. Stir in chicken stock. Simmer 2-3 minutes on heat 3.\n6.\nDrain noodles. Return to pot, mix with margarine, dill and chives.\n7.\nOff heat, stir sour cream into chicken mixture. Serve over egg noodles."},
{name:"Cooked Rice",cat:"Rice",img:"",ing:"COOKED MINUTE RICE (2 servings)\n1 Cup Minute Rice\n1 Tbsp Margarine\n1 Cup Water\n1 tsp Salt",steps:"1.\nAdd water, margarine and salt to a small pot. Bring to a boil.\n2.\nRemove from stove, add rice, place lid on pot and let sit 10 minutes.\n3.\nFluff with a spatula or fork before serving."},
{name:"Chicken a la King",cat:"Chicken",img:"",ing:"CHICKEN A LA KING (4 servings)\n1 Cup leftover Roast Chicken, cut into small pieces\n1 Medium Onion, diced\nChicken Stock (1-1/2 tsp powder + 1-1/2 cups water)\n1/3 Cup Flour\n3/4 Cup Milk\n1/2 Cup Margarine\n1/2 Cup Heavy/Whipping Cream\n2 Cups Frozen Vegetables, thawed\n1/2 tsp Dry Mustard\n1/4 tsp Pepper, 1/2 tsp Salt, 1/2 tsp Onion Powder\n\nRice: 1 Cup Minute Rice, 1 Cup Water, 1 tsp Salt, 1 Tbsp Margarine",steps:"1.\nMake Rice and Chicken Stock.\n2.\nMelt margarine in large pot over heat 4. Add onion and cook 5-6 minutes until soft.\n3.\nSprinkle in flour and stir constantly until well combined.\n4.\nPour in chicken stock and mix well.\n5.\nAdd milk, salt, pepper, dry mustard and onion powder. Reduce to heat 3 and simmer uncovered 10 minutes, stirring occasionally.\n6.\nStir in heavy cream and vegetables. Simmer 6 more minutes.\n7.\nAdd chicken and simmer 5 more minutes. Serve over cooked rice."},
{name:"Chicken & Spaghetti with Pesto",cat:"Chicken",img:"",ing:"CHICKEN AND SPAGHETTI WITH PESTO GRAVY (2 servings)\nSauce: 1 Tbsp Margarine, 1 Tbsp Flour, Chicken Stock (1/2 tsp powder + 1/2 cup water), 1/2 Cup Milk, 3 Tbsp Pesto\n\n1/2 Tbsp Balsamic Vinegar\n1 Boneless Skinless Chicken Breast, cut into bite-size pieces\n2 portions Spaghetti\n1/4 tsp Salt, 1/4 tsp Pepper",steps:"1.\nMake Chicken Stock. Marinate chicken in balsamic vinegar with salt and pepper.\n2.\nBring large pot of salted water to boil. Cook spaghetti 10-12 minutes.\n3.\nSpray air fryer with EVOO, add chicken strips, spray tops. Cook at 400F for 5 minutes, flip, cook another 3 minutes. Internal temp should be 165F.\n4.\nMelt margarine in wok pan over heat 4. Add flour and whisk, let sit 1 minute. Add chicken stock and milk, heat until bubbling. Remove from heat, add pesto and mix.\n5.\nDivide spaghetti between plates. Top with chicken and pesto gravy."},
{name:"Steak Gruyere",cat:"Beef",img:"",ing:"STEAK GRUYERE AND GREEN BEANS (2 servings)\nGruyere Sauce: 1 Tbsp Margarine, 1-1/2 Tbsp Flour, Chicken Stock (1/4 tsp powder + 1/4 cup water), 1/4 Cup Milk, 1/4 Cup Shredded Gruyere Cheese\n\n3 Tbsp Margarine\n2 Cups Steak Strips, cut into bite-size pieces\n1 Medium Onion, thinly sliced into half rings\n2 Cups Green Beans, ends trimmed\n2 Bay Leaves\n1 tsp Ground Thyme\nSalt and Pepper",steps:"1.\nMake Chicken Stock. Set oven to broil high.\n2.\nFill steamer with water. Add green beans to basket. Steam 15 minutes.\n3.\nMelt 3 Tbsp margarine in small pan over heat 2. Add onions, bay leaves and thyme. Caramelize 10-15 minutes, stirring occasionally.\n4.\nPlace steak in casserole dish, season with salt and pepper. Broil 10 minutes, stirring occasionally.\n5.\nMelt 1 Tbsp margarine in small pot over heat 4. Add flour and whisk, let sit 1 minute. Add chicken stock and milk, heat until bubbling. Off heat, add Gruyere and stir until melted.\n6.\nPlate green beans and steak. Top with caramelized onions and drizzle cheese sauce over everything."},
{name:"Chicken Stock",cat:"Chicken",img:"",ing:"CHICKEN STOCK (1 Cup)\n1 tsp Chicken Stock Powder\n1 Cup Water",steps:"1.\nBring a kettle of water to a boil.\n2.\nStir together 1 cup boiled water with 1 tsp. chicken stock mix."},
{name:"Air Fryer Chicken & Asparagus",cat:"Chicken",img:"",ing:"AIR FRYER CHICKEN & OVEN ROASTED ASPARAGUS (2 servings)\nChicken: 2 Boneless Skinless Chicken Breasts cut into strips, 5 Tbsp Margarine melted\nCoating: 1/4 Cup Flour, 1/8 Cup Panko Breadcrumbs, 1/8 tsp Salt, 1 tsp Seasoning Salt, 1/8 tsp Pepper, 1/2 tsp Paprika\n\nAsparagus: 1 bunch Asparagus (rinsed, dried, ends trimmed), 1/2 Tbsp EVOO, 1/2 tsp Kosher Salt, 1/4 tsp Pepper, 2 Cloves Garlic minced, Parmesan Cheese (optional)",steps:"1.\nPreheat oven to 425F. Line baking sheet with parchment.\n2.\nToss asparagus with EVOO, Kosher salt, pepper and garlic. Arrange in single layer on baking sheet. Roast 10 minutes, flip, roast another 10 minutes. Top with Parmesan if desired.\n3.\nSpray air fryer basket with EVOO. Combine coating ingredients in a container. Dip chicken strips in coating.\n4.\nPlace chicken in air fryer basket leaving space. Brush tops with margarine. Cook at 400F for 5 minutes, flip, cook another 5 minutes. Internal temp should be 165F.\n5.\nServe chicken alongside asparagus."},
{name:"Tomato Macaroni Casserole",cat:"Pasta",img:"",ing:"TOMATO MACARONI CASSEROLE (6 servings)\n2 lbs Ground Beef\n1 Medium Onion, diced\n3 Garlic Cloves, minced\n2 Cans Tomato Soup\n2 Tbsp Italian Seasoning\n1/2 tsp Salt, 1/4 tsp Pepper\n1/2 Tbsp Extra Virgin Olive Oil (EVOO)\n3 Cups uncooked Elbow Macaroni\n1/2 Brick Cheese, shredded\n2 Tbsp Parsley",steps:"1.\nPreheat oven to 350F.\n2.\nBoil salted water. Cook macaroni 10-12 minutes, drain.\n3.\nHeat EVOO in wok pan over heat 4. Cook onions 5-6 minutes. Add beef, break up and cook 7-8 minutes until browned. Drain. Add garlic, salt and pepper. Cook 2 more minutes.\n4.\nIn casserole dish, mix tomato soup and Italian seasoning. Add macaroni, mix. Add beef mixture and stir until combined.\n5.\nSprinkle cheese evenly over top, then sprinkle parsley.\n6.\nBake 20-25 minutes."},
{name:"Simple Chicken StirFry",cat:"Chicken",img:"",ing:"SIMPLE ASIAN CHICKEN STIR-FRY (3 servings)\n1 Boneless Skinless Chicken Breast, cut into bite-size pieces\n1 Carrot, cut into bite size pieces\n1 Onion, sliced into half rings\n1 Bundle Broccoli, cut into florets\n1 Cup Asian Sesame Salad Dressing\n1 Tbsp Soy Sauce\nSalt and Pepper, Pinch Garlic Salt\n1 Tbsp Extra Virgin Olive Oil (EVOO)\n\nRice: 1 Cup Minute Rice, 1 Cup Water, 1 tsp Salt, 1 Tbsp Margarine",steps:"1.\nMake Rice: Boil water with salt and margarine. Off heat, add rice, cover, remove from element.\n2.\nSteam broccoli, carrots and onion for about 25 minutes.\n3.\nSeason chicken with salt, pepper and garlic salt. Heat EVOO in large pan over heat 6. Cook chicken with soy sauce and 1 Tbsp sesame dressing, stirring occasionally.\n4.\nCombine cooked chicken and vegetables in pan. Add remaining sesame dressing and mix.\n5.\nServe over cooked rice."},
{name:"Swedish Meatballs",cat:"Meatballs",img:"",ing:"SWEDISH MEATBALLS (4 servings)\nMeatballs: 1 lb Ground Beef, 1/4 Cup Panko Bread Crumbs, 1 Tbsp Parsley, 1/4 tsp Ground Allspice, 1/4 tsp Ground Nutmeg, 1/4 Cup Onion minced, 1/2 tsp Garlic Powder, 1/8 tsp Pepper, 1/2 tsp Salt, 1 Egg\n\nSauce: 5 Tbsp Margarine, 5 Tbsp Flour, Beef Stock (2 tsp powder + 2 cups water), 1 Cup Heavy Cream, 1 Tbsp Worcestershire Sauce, 1 tsp Dijon Mustard\n\n1 Tbsp Extra Virgin Olive Oil (EVOO)\n4 Cups Egg Noodles",steps:"1.\nMake Beef Stock: Boil 2 cups water, add 2 tsp. beef stock powder.\n2.\nBoil salted water, cook egg noodles 10 minutes.\n3.\nCombine all meatball ingredients. Roll into 20 small meatballs.\n4.\nHeat EVOO in large pan over heat 6. Cook meatballs, turning frequently until browned and cooked through. Transfer to plate, cover with foil.\n5.\nIn same pan, melt margarine. Add flour and whisk, let sit 1 minute. Slowly add beef stock and heavy cream. Add Worcestershire sauce and Dijon mustard. Simmer until sauce thickens.\n6.\nReturn meatballs to pan and simmer 1-2 minutes. Serve over egg noodles."},
{name:"Chicken Pizza",cat:"Chicken",img:"",ing:"CHICKEN PIZZA (2 servings)\n2 Large Boneless Skinless Chicken Breasts, cut into bite size pieces\n1 tsp Italian Seasoning\n1/2 tsp Garlic Powder\n1/2 Cup sliced Pepperoni\n5 Tbsp Pizza Sauce\n2 Large Mushrooms, thinly sliced\n1 Green Pepper, thinly sliced\n1/2 Cup Mozzarella Cheese, grated\n1 Tbsp Margarine\n1 Tbsp Extra Virgin Olive Oil (EVOO)",steps:"1.\nPreheat oven to 375F.\n2.\nSeason chicken with salt, pepper and 1/2 tsp Italian Seasoning.\n3.\nMelt margarine in medium pan over heat 6. Cook mushrooms with garlic powder 5 minutes. Add green peppers and cook another 5-6 minutes.\n4.\nHeat EVOO in large pan over heat 6. Cook seasoned chicken 5-6 minutes until cooked through.\n5.\nIn casserole dish: layer chicken, pizza sauce, pepperoni, mushrooms and peppers, cheese and remaining Italian seasoning.\n6.\nBake 25 minutes until cheese is completely melted."},
{name:"Sesame Chicken",cat:"Chicken",img:"",ing:"SESAME CHICKEN (2-3 servings)\nSesame Sauce: 2 Tbsp Brown Sugar, 4 Tbsp Soy Sauce, 1 Tbsp Sesame Oil, 1 Tbsp Rice Vinegar, 2 Tbsp Honey, 2 Tbsp Sweet Chili Sauce, 3 Tbsp Ketchup, 2 Garlic Cloves minced\n\n1 Large Boneless Skinless Chicken Breast, cut into strips\n2-1/2 Tbsp Extra Virgin Olive Oil (EVOO)\nCoating: 1 Egg lightly beaten, 3 Tbsp Cornstarch, 5 Tbsp Flour, 1/4 tsp Salt, 1/4 tsp Pepper, 1/4 tsp Garlic Powder, 1 tsp Paprika\n1 Small bunch Green Onions, chopped\n\nRice: 1 Cup Minute Rice, 1 Cup Water, 1 tsp Salt, 1 Tbsp Margarine",steps:"1.\nMake Rice.\n2.\nMix sesame sauce ingredients in a small bowl.\n3.\nHeat EVOO in large pan over heat 6 until very hot.\n4.\nSet up dredging stations: cornstarch / egg / seasoned flour. Dredge chicken in cornstarch, dip in egg, dredge in flour.\n5.\nCook chicken 8-10 minutes, turning occasionally until fully cooked.\n6.\nAdd sauce to pan, bring to a bubble on high heat. Coat chicken in sauce 1-2 minutes. Add green onions and toss.\n7.\nServe on top of rice."},
{name:"Shepherd's Pie",cat:"Beef",img:"",ing:"SHEPHERD'S PIE (4 servings)\n1 lb Ground Beef\n3 Large Potatoes, peeled and cut into small pieces\n1 Medium Onion, diced\n3-4 Tbsp Margarine\n5 Garlic Cloves (crushed) + 3 Garlic Cloves (minced)\n1 Can (341 mL) Corn\n1 Can (540 mL) Cream Corn\nSalt and Pepper\n1 tsp Parsley\n1 tsp Savory Flakes\nBeef Gravy (for serving)",steps:"1.\nPreheat oven to 375F.\n2.\nBoil potatoes with 5 crushed garlic cloves until fork-tender (10-15 min).\n3.\nBrown beef in large pan over heat 6, breaking up. Drain. Add onions and 3 minced garlic cloves. Cook 4-5 more minutes.\n4.\nMix corn and cream corn in a bowl.\n5.\nDrain potatoes. Mash with margarine and savory flakes.\n6.\nIn casserole dish: layer beef, then corn mixture, then mashed potatoes. Top with parsley.\n7.\nBake 20 minutes. Heat beef gravy until bubbling. Serve over shepherd's pie."},
{name:"Honey Garlic Pork Chops",cat:"Pork",img:"",ing:"HONEY GARLIC PORK CHOPS (2 servings)\nGlaze: 1/4 Cup Honey, 2 tsp Soy Sauce, 2 Cloves Garlic minced\n\n2 Boneless Pork Chops\nSalt and Pepper\n2 Tbsp Extra Virgin Olive Oil (EVOO)",steps:"1.\nWhisk glaze ingredients together. Set aside.\n2.\nHeat EVOO in large pan over heat 6. Season pork chops with salt and pepper. Cook 6 minutes, flip, cook 6 more minutes until cooked through.\n3.\nAdd glaze to pan, cook about 1 minute. Remove pork chops and continue cooking glaze until thick (pancake syrup consistency).\n4.\nServe thickened glaze over pork chops."},
{name:"Mongolian Beef",cat:"Beef",img:"",ing:"MONGOLIAN BEEF (2 servings)\nMarinade: 1/4 Cup Soy Sauce, 1 tsp Ground Ginger, 2 Cloves Garlic minced\n\n1 lb. Flank Steak, thinly sliced\n1 Tbsp Coconut Oil\n3 Green Onions, cut into 1-inch diagonal slices\n\nRice: 1 Cup Minute Rice, 1 Cup Water, 1 tsp Salt, 1 Tbsp Margarine",steps:"1.\nMarinate sliced steak in soy sauce, ginger and garlic. Chill 1 hour.\n2.\nMake Rice.\n3.\nHeat coconut oil in large pan over heat 7 until almost smoking (about 10 minutes).\n4.\nDrain steak, reserving marinade. Add meat to hot pan, stirring continuously until cooked through (about 4 minutes).\n5.\nAdd green onions, cook 1 minute.\n6.\nAdd reserved marinade, stir and cook 30 seconds to 1 minute.\n7.\nServe over cooked rice."},
{name:"Spiced Grilled Chicken",cat:"Chicken",img:"",ing:"SPICED GRILLED CHICKEN (2 servings)\n2 Boneless Skinless Chicken Breasts, butterflied\n2 Tbsp Extra Virgin Olive Oil (EVOO)\n1/2 tsp Kosher Salt\n1 tsp Garlic Powder\n1/4 tsp Cayenne Pepper\n1/4 tsp Pepper",steps:"1.\nPreheat grill pan for 10 minutes.\n2.\nMix EVOO, garlic powder, Kosher salt, pepper and cayenne pepper.\n3.\nPat dry chicken. Brush both sides with EVOO/spice mixture.\n4.\nGrill 7 minutes, flip, grill 7 more minutes. If needed, flip and cook 3 additional minutes until fully cooked."},

/* ─────────────────────────────────────────────────────────────────
   LOCAL STORAGE
   Recipes are saved to the browser's localStorage under the key 'k_v4'.
   On load, any saved data replaces the built-in recipe array so that
   added/edited/deleted recipes persist between sessions.

   NOTE: localStorage is per-browser-profile. If you switch browsers
   your saved additions won't carry over. The built-in recipes above
   are always the fallback if no saved data exists.
───────────────────────────────────────────────────────────────── */
try {
  const saved = localStorage.getItem('k_v4');
  if (saved) recipes = JSON.parse(saved);
} catch(e) {}

function save() { localStorage.setItem('k_v4', JSON.stringify(recipes)); }


/* ─────────────────────────────────────────────────────────────────
   STATE
───────────────────────────────────────────────────────────────── */
let editIdx = null;      /* index of the recipe currently being viewed/edited */
let activeFilter = 'All'; /* currently selected category pill */


/* ─────────────────────────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────────────────────────── */
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }


/* ─────────────────────────────────────────────────────────────────
   TOAST NOTIFICATION
   showToast('message') or showToast('message', 'error')
   The toast auto-disappears after ~2.6 seconds.
───────────────────────────────────────────────────────────────── */
let _toastTimer;
function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = (type === 'success' ? '✓  ' : '✕  ') + msg;
  el.className = 'toast ' + type + ' show';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}


/* ─────────────────────────────────────────────────────────────────
   MOBILE SIDEBAR TOGGLE
   Adds/removes .sidebar-open on the sidebar and shows/hides overlay.
   Called by the ☰ button and by clicking the overlay.
───────────────────────────────────────────────────────────────── */
function toggleSidebar() {
  const sb  = document.getElementById('sidebar');
  const ov  = document.getElementById('sidebarOverlay');
  const btn = document.getElementById('mobileToggle');
  const open = sb.classList.toggle('sidebar-open');
  ov.classList.toggle('visible', open);
  btn.textContent = open ? '✕' : '☰';
}

/* Close sidebar after picking a recipe on mobile */
function closeSidebarIfMobile() {
  if (window.innerWidth <= 580) {
    const sb = document.getElementById('sidebar');
    if (sb.classList.contains('sidebar-open')) toggleSidebar();
  }
}


/* ─────────────────────────────────────────────────────────────────
   CATEGORY & LIST RENDERING
───────────────────────────────────────────────────────────────── */

/* Returns ['All', ...sorted unique categories] */
function getCategories() {
  return [
    'All',
    ...[...new Set(recipes.flatMap(r => r.cat || []))].sort()
  ];
}
/* Returns recipes matching the current search term and category filter */
function getFiltered() {
  const input = document.getElementById('search').value.toLowerCase().trim();

  // Split search into words
  const terms = input.split(/\s+/).filter(Boolean);

  const includeTerms = terms.filter(t => !t.startsWith('!'));
  const excludeTerms = terms.filter(t => t.startsWith('!')).map(t => t.slice(1));

  return recipes.filter(r => {
    const cats = Array.isArray(r.cat) ? r.cat : [r.cat];

    const matchesCategory =
      activeFilter === 'All' || cats.includes(activeFilter);

    const name = r.name.toLowerCase();
    const ingredientsList = (r.ing || '')
  .toLowerCase()
  .split(/\n|,/)
  .map(i => i.trim());

const ingredients = ingredientsList.join(' ');
    const categoryText = cats.join(' ').toLowerCase();

    // Check ALL include terms must match somewhere
    const matchesInclude = includeTerms.every(term =>
      name.includes(term) ||
      categoryText.includes(term) ||
      ingredients.includes(term)
    );

    // Check NO exclude terms appear in ingredients
    const matchesExclude = excludeTerms.every(term =>
      !ingredients.includes(term)
    );

    return matchesCategory && matchesInclude && matchesExclude;
  });
}

/* Renders the category pill buttons above the recipe list */
function renderCats() {
  const el = document.getElementById('catFilters');
  el.innerHTML = '';
  getCategories().forEach(cat => {
    const b = document.createElement('button');
    b.className = 'cat-pill' + (cat === activeFilter ? ' active' : '');
    b.textContent = cat;
    b.onclick = () => { activeFilter = cat; renderCats(); renderList(); };
    el.appendChild(b);
  });
}

/* Renders the scrollable recipe list in the sidebar */
function renderList() {
  const el = document.getElementById('recipeList');
  const filtered = getFiltered();
  el.innerHTML = '';
  document.getElementById('recipeCount').textContent =
    filtered.length + ' recipe' + (filtered.length !== 1 ? 's' : '');

  filtered.forEach(r => {
    const i = recipes.indexOf(r);
    const div = document.createElement('div');
    div.className = 'recipe-item' + (i === editIdx ? ' active' : '');

    /* Drag-and-drop reordering: drag a row up/down to change order */
    div.draggable = true;
    div.dataset.index = i;
    div.innerHTML = `
<div class="item-icon">${r.emoji || icon(r.cat)}</div>
      <div class="item-text">
        <div class="item-name">${r.name}</div>
<div class="item-cat">
  ${(Array.isArray(r.cat) ? r.cat : [r.cat]).join(' • ')}
</div>
      </div>`;

    div.onclick = () => { showDetail(i); closeSidebarIfMobile(); };

    /* Drag events for reordering */
    div.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', i));
    div.addEventListener('dragover',  e => e.preventDefault());
    div.addEventListener('drop', e => {
      e.preventDefault();
      const from = parseInt(e.dataTransfer.getData('text/plain'));
      const to   = i;
      if (from === to) return;
      const moved = recipes.splice(from, 1)[0];
      recipes.splice(to, 0, moved);
      save(); renderList(); renderCats(); renderStats();
    });

    el.appendChild(div);
  });
}

/* Renders the "Recently Added" chips — shows the last 5 recipes */
function renderRecent() {
