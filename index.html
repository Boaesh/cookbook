/* Picks and renders today's rotating quote */
function renderQuote() {
  const day = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  const q = QUOTES[day % QUOTES.length];
  document.getElementById('quoteText').textContent = `"${q.text}"`;
  document.getElementById('quoteAttr').textContent = `— ${q.author}`;
}


/* ─────────────────────────────────────────────────────────────────
   IMAGE HELPERS
   setHeroImage: tries to load images/<recipe name>.<ext> in sequence.
   If none loads, falls back to the category emoji.
───────────────────────────────────────────────────────────────── */

/* Tries image extensions in order: .jpg → .jpeg → .png → .webp */
function setHeroImage(r, hero) {
  /* If the recipe has an explicit img path saved, use that first */
  if (r.img && r.img.trim()) {
    const img = new Image();
    img.src = r.img;
    img.onload = () => {
      hero.style.backgroundImage = `url('${r.img}')`;
      hero.style.backgroundSize  = 'cover';
      hero.style.backgroundPosition = 'center';
      hero.textContent = '';
    };
    img.onerror = () => tryByName(r, hero); /* fallback: try by name */
    return;
  }
  tryByName(r, hero);
}

function tryByName(r, hero) {
  const name = r.name;

  const candidates = [
    name,
    slugify(name),
    name.toLowerCase(),
    name.replace(/\s+/g, '-'),
    name.replace(/\s+/g, '_'),
    name.replace(/[^a-zA-Z0-9]/g, '')
  ];

  const exts = ['.jpg', '.jpeg', '.png', '.webp'];

  let i = 0;
  let c = 0;

  function tryNext() {
    if (c >= candidates.length) {
      hero.style.backgroundImage = '';
      hero.textContent = r.emoji || icon(r.cat);
      return;
    }

    if (i >= exts.length) {
      i = 0;
      c++;
      tryNext();
      return;
    }

    const path = 'images/' + candidates[c] + exts[i];

    const img = new Image();
    img.src = path;

    img.onload = () => {
      hero.style.backgroundImage = `url("${path}")`;
      hero.style.backgroundSize = 'cover';
      hero.style.backgroundPosition = 'center';
      hero.style.backgroundRepeat = 'no-repeat';
      hero.textContent = '';
    };

    img.onerror = () => {
      i++;
      tryNext();
    };
  }

  tryNext();
}

/* ── Form image browse helpers ── */

/* Called when a file is picked via the Browse button.
   Fills the text field with images/<filename> and shows a live preview. */
function handleImgFile(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  const blobUrl = URL.createObjectURL(file);
  const pathField = document.getElementById('f_img');
  pathField.value = 'images/' + file.name;
  pathField._blobUrl = blobUrl; /* store blob url separately for preview */
  showImgPreview(blobUrl);
  input.value = ''; /* reset so same file can be re-picked */
}

/* Called as the user types in the image path field */
function previewImg(val) {
  const inp = document.getElementById('f_img');
  if (!val || !val.trim()) { hideImgPreview(); return; }
  showImgPreview(inp._blobUrl || val);
}

function showImgPreview(src) {
  const wrap = document.getElementById('imgPreviewWrap');
  const img  = document.getElementById('imgPreview');
  img.src = src;
  img.onerror = () => { wrap.style.display = 'none'; };
  img.onload  = () => { wrap.style.display = 'inline-block'; };
  if (img.complete && img.naturalWidth) wrap.style.display = 'inline-block';
}

function hideImgPreview() {
  document.getElementById('imgPreviewWrap').style.display = 'none';
  document.getElementById('imgPreview').src = '';
}

/* Clears the image field and preview */
function clearImg() {
  const inp = document.getElementById('f_img');
  inp.value = '';
  inp._blobUrl = null;
  hideImgPreview();
}


/* ─────────────────────────────────────────────────────────────────
   NAVIGATION FUNCTIONS
───────────────────────────────────────────────────────────────── */

/* Go to the home/welcome screen */
function goHome() {
  hide('detailView'); hide('formView'); show('welcome');
  editIdx = null;
  renderList(); /* un-highlights any active item */
}

/* Show the Add New Recipe form */
function showAdd() {
  editIdx = null;
  hide('welcome'); hide('detailView'); show('formView');
  document.getElementById('formTitle').innerHTML   = 'New <em>Creation</em>';
  document.getElementById('formSubtitle').textContent = 'Add a new recipe to your collection.';
  /* Clear all fields */
  ['f_name','f_cat','f_img','f_ing','f_steps'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('f_img')._blobUrl = null;
  hideImgPreview();
  closeSidebarIfMobile();
}

/* Open a recipe in the detail/read view */
function showDetail(i) {
  editIdx = i;
  const r = recipes[i];
  hide('welcome'); hide('formView'); show('detailView');

document.getElementById('detCat').textContent =
  (Array.isArray(r.cat) ? r.cat : [r.cat]).join(' • ');
  document.getElementById('detTitle').textContent = r.name;

  /* Set hero image (tries file first, then emoji fallback) */
  const hero = document.getElementById('heroEmoji');
  hero.textContent = '';
console.log("IMAGE DEBUG:", r.img, r.name);
setHeroImage(r, hero);

  /* Ingredients */
  document.getElementById('detIng').textContent = r.ing;

  /* Method: parse numbered steps into styled bubbles */
  const stepsEl = document.getElementById('detSteps');
  const raw = r.steps || '';
  const hasNumbers = /^\d+\./m.test(raw);
  if (hasNumbers) {
    const parts = raw.split(/\n(?=\d+\.)/);
    let html = '';
    parts.forEach(part => {
      const m = part.match(/^(\d+)\.\s*([\s\S]*)/);
      if (m) html += `<div class="step">
                        <div class="step-num">${m[1]}</div>
                        <div class="step-text">${m[2].trim()}</div>
                      </div>`;
      else if (part.trim()) html += `<div class="raw-steps">${part.trim()}</div>`;
    });
    stepsEl.innerHTML = html || `<div class="raw-steps">${raw}</div>`;
  } else {
    stepsEl.innerHTML = `<div class="raw-steps">${raw}</div>`;
  }

  /* Wire up Edit and Delete buttons */
  document.getElementById('btnEdit').onclick   = () => editRecipe(i);
  document.getElementById('btnDelete').onclick = () => deleteRecipe(i);

  renderList(); /* update active highlight in sidebar */
}

/* Open a recipe in the Edit form */
function editRecipe(i) {
  const r = recipes[i];
  editIdx = i;
  hide('detailView'); show('formView');
  document.getElementById('formTitle').innerHTML      = 'Edit <em>Recipe</em>';
  document.getElementById('formSubtitle').textContent = 'Make changes and save.';
  document.getElementById('f_name').value  = r.name;
document.getElementById('f_cat').value =
  Array.isArray(r.cat) ? r.cat.join(', ') : r.cat;
  document.getElementById('f_ing').value   = r.ing;
  document.getElementById('f_steps').value = r.steps;
  document.getElementById('f_emoji').value = r.emoji || '';
  /* Image field */
  const imgInp = document.getElementById('f_img');
imgInp.value = r.img && r.img.startsWith('images/') ? r.img : '';
  imgInp._blobUrl = null;
if (r.img && r.img.trim() && r.img.startsWith('images/')) {
  showImgPreview(r.img);
} else {
  hideImgPreview();
}
}

/* Save new or edited recipe */
function saveRecipe() {
  const imgInp = document.getElementById('f_img');
const r = {
  name:  document.getElementById('f_name').value.trim(),
  cat: document.getElementById('f_cat').value
    .split(',')
    .map(c => c.trim())
    .filter(Boolean)
    || ['Other'],
  img:   imgInp.value.trim(),
  ing:   document.getElementById('f_ing').value,
  steps: document.getElementById('f_steps').value,
  emoji: document.getElementById('f_emoji')?.value || ''
};
  if (!r.name) { showToast('Please give your recipe a name.', 'error'); return; }
  if (editIdx !== null) {
    recipes[editIdx] = r;
    showToast('Recipe updated!');
  } else {
    recipes.push(r);
    editIdx = recipes.length - 1;
    showToast('Recipe saved!');
  }
  save(); renderCats(); renderList(); renderStats(); renderRecent();
  showDetail(editIdx);
}

/* Delete a recipe with a confirmation prompt */
function deleteRecipe(i) {
  if (confirm('Remove "' + recipes[i].name + '" from your collection?')) {
    recipes.splice(i, 1);
    editIdx = null;
    save(); renderCats(); renderList(); renderStats(); renderRecent();
    hide('detailView'); show('welcome');
    showToast('Recipe removed.');
  }
}

/* Cancel the form and go back to where we came from */
function hideForm() {
  hide('formView');
  if (editIdx !== null) showDetail(editIdx); else show('welcome');
}

/* Sort all recipes alphabetically A → Z and save */
function sortRecipesAZ() {
  recipes.sort((a, b) => a.name.localeCompare(b.name));
  save(); renderList(); renderCats(); renderStats(); renderRecent();
  showToast('Sorted A → Z');
}

/* Makes your image system reliable, flexible, and impossible to “break again” without changing your folder structure */
function slugify(name) {
  return name
    .toLowerCase()
    .trim()
    .replace(/&/g, 'and')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

   Run these on page load to populate everything.
───────────────────────────────────────────────────────────────── */
renderQuote();
renderCats();
renderList();
renderStats();
renderRecent();
